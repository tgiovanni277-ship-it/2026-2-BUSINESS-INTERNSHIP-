services:
  web:
    ports: ["127.0.0.1:3000:3000"]
  relay-worker:
    environment:
      RELAY_ENV: development
      GHL_MODE: mock
  relay-postgres:
    ports: ["127.0.0.1:5434:5432"]
  redis:
    ports: ["127.0.0.1:6380:6379"]
  n8n:
    ports: ["127.0.0.1:5679:5678"]
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_WEBHOOK_URL: http://localhost:5679/
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
