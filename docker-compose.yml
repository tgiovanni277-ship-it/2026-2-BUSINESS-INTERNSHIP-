x-relay-database: &relay-database
  RELAY_DB_HOST: pgbouncer
  RELAY_DB_PORT: 5432
  RELAY_DB_NAME: relay
  RELAY_DB_USER: relay
  RELAY_DB_PASSWORD: ${RELAY_DB_PASSWORD:?Define RELAY_DB_PASSWORD}

services:
  caddy:
    image: caddy:2
    profiles: [production]
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:-localhost}
      ADMIN_IP: ${ADMIN_IP:-127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, n8n]
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: run
      args:
        NEXT_PUBLIC_META_PIXEL_ID: ${META_PIXEL_ID:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    environment:
      <<: *relay-database
      NEXT_PUBLIC_META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_TOKEN: ${META_CAPI_TOKEN:-}
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-600000}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-false}
    depends_on:
      relay-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  relay-migrate:
    build:
      context: ./web
      target: worker
    command: ["node", "scripts/migrate.mjs"]
    environment:
      <<: *relay-database
      RELAY_DB_HOST: relay-postgres
      RELAY_N8N_DB_PASSWORD: ${RELAY_N8N_DB_PASSWORD:?Define RELAY_N8N_DB_PASSWORD}
    depends_on:
      relay-postgres:
        condition: service_healthy
    restart: "no"

  relay-worker:
    build:
      context: ./web
      target: worker
    environment:
      <<: *relay-database
      RELAY_ENV: ${RELAY_ENV:-staging}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/relay-classify
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?Define N8N_WEBHOOK_SECRET}
      RELAY_POLL_MS: ${RELAY_POLL_MS:-5000}
      RELAY_MAX_ATTEMPTS: ${RELAY_MAX_ATTEMPTS:-8}
      GHL_MODE: live
      GHL_PRIVATE_INTEGRATION_TOKEN: ${GHL_PRIVATE_INTEGRATION_TOKEN:-}
      GHL_LOCATION_ID: ${GHL_LOCATION_ID:-}
    depends_on:
      relay-migrate:
        condition: service_completed_successfully
      n8n:
        condition: service_started
      pgbouncer:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped

  relay-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${RELAY_DB_PASSWORD:?Define RELAY_DB_PASSWORD}
      POSTGRES_DB: relay
    volumes:
      - relay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DB_HOST: relay-postgres
      DB_PORT: 5432
      DB_NAME: relay
      DB_USER: relay
      DB_PASSWORD: ${RELAY_DB_PASSWORD:?Define RELAY_DB_PASSWORD}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
    depends_on:
      relay-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.42.5}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Define N8N_ENCRYPTION_KEY}
      N8N_HOST: n8n.${DOMINIO:-localhost}
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: 1
      N8N_WEBHOOK_URL: https://n8n.${DOMINIO:-localhost}/
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${N8N_SAVE_SUCCESS_EXECUTIONS:-none}
      GENERIC_TIMEZONE: America/New_York
      TZ: America/New_York
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # Keep the existing n8n volume on its current major version.
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
  pg_data:
  relay_pg_data:
